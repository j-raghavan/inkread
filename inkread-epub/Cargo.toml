[package]
name = "inkread-epub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "EPUB container parsing + (forthcoming) pure-Rust reflow for inkread (RR2-FR5 / ADR-INKREAD-0007). Host-testable; names no vendor (IR-7)."

[dependencies]
rbook = "0.7.9"
# Legacy-encoding repair before rbook sees the book (#159): rbook refuses any non-UTF-8 resource
# outright, which makes a windows-1251 Russian EPUB unopenable. `zip` reads and rewrites the
# container (already a workspace dep for CBZ); `encoding_rs` does the decoding.
zip = { workspace = true }
encoding_rs = { workspace = true }
# scraper (html5ever-based, ISC) parses chapter XHTML into a tree we lower to our own owned content
# model; the parse tree is transient (never escapes parse_blocks). ego-tree (scraper's own tree, MIT)
# is named directly so the recursive walker can take a `NodeRef`.
scraper = { version = "0.27", default-features = false }
ego-tree = "0.11"
# ab_glyph (Apache-2.0/MIT, pure Rust) — glyph advances (Metrics) + outline rasterization for the
# reflow renderer; cross-compiles to aarch64-android with no native font lib.
ab_glyph = "0.2"
hyphenation = { version = "0.8.4", features = ["embed_en-us"] }
# unicode-linebreak (Apache-2.0, pure Rust) — UAX #14 line-break opportunities, so unspaced scripts
# (CJK) wrap between characters with the standard's prohibition rules (a line never starts with 。)
# instead of overflowing as one unbreakable "word".
unicode-linebreak = "0.1"
# simplecss (MIT/Apache-2.0) — CSS selector parsing + matching for the narrow block-styling subset
# (#188/#201). We keep the policy (which properties are honoured); the crate owns selectors,
# combinators and specificity, which the previous hand-rolled matcher dropped. Deliberately not
# scraper's own cssparser/selectors stack: scraper keeps its SelectorList private, so specificity is
# unreachable through it.
simplecss = "0.2.2"
